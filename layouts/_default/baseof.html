<!doctype html>
<html lang="{{ site.Language.Locale | default "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6d3cff">
    <meta name="description" content="{{ .Description | default site.Params.description }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Params.labName }}{{ end }}</title>
    <link rel="icon" href="{{ "images/favicon.svg" | relURL }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    {{ $styleVersion := os.ReadFile "static/css/site.css" | crypto.SHA256 | truncate 12 "" }}
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}?v={{ $styleVersion }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {{ partial "header.html" . }}
    <main id="main">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
    <script src="{{ "js/site.js" | relURL }}" defer></script>
  </body>
</html>
