name: Build and deploy GMI Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.162.0
  HUGO_ENVIRONMENT: production
  HUGO_CANONIFYURLS: 'true'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo
        run: |
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz?run=${GITHUB_RUN_ID}&attempt=${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${RUNNER_TEMP}/hugo-bin"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo-bin" hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --destination public
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
